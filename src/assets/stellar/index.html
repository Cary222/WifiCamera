  <script>
    // WKWebView rejects fetch() on file:// URLs (XMLHttpRequest is allowed), so when the
    // scene runs from the iOS app bundle, route file:// fetches through XHR. On Android's
    // https appassets origin this is a no-op passthrough.
    (function () {
      const nativeFetch = window.fetch ? window.fetch.bind(window) : null;
      if (!nativeFetch) return;
      window.fetch = function (input, init) {
        const url = typeof input === 'string' ? input : (input && input.url);
        const method = (init && init.method) ? String(init.method).toUpperCase() : 'GET';
        if (url && url.startsWith('file://') && method === 'GET') {
          return new Promise((resolve, reject) => {
            const xhr = new XMLHttpRequest();
            xhr.open('GET', url, true);
            xhr.responseType = 'arraybuffer';
            xhr.onload = () => {
              if (xhr.status === 200 || (xhr.status === 0 && xhr.response)) {
                const contentType = url.endsWith('.wasm')
                  ? 'application/wasm'
                  : url.endsWith('.json')
                    ? 'application/json'
                    : 'application/octet-stream';
                resolve(new Response(xhr.response, {
                  status: 200,
                  statusText: 'OK',
                  headers: { 'Content-Type': contentType },
                }));
              } else {
                reject(new TypeError(`fetch failed for ${url} with status ${xhr.status}`));
              }
            };
            xhr.onerror = () => reject(new TypeError(`fetch network error for ${url}`));
            xhr.send(null);
          });
        }
        return nativeFetch(input, init);
      };
    })();
  </script>

        equatorial_j2000: false,

      const EPSILON_J2000 = 0.409092804; // 23.4392911 deg obliquity of ecliptic J2000.0
      const COS_EPS = Math.cos(EPSILON_J2000);
      const SIN_EPS = Math.sin(EPSILON_J2000);

      // Precompute 360 points along the Ecliptic in ICRF frame
      const ECLIPTIC_POINTS = [];
      for (let deg = 0; deg < 360; deg += 1) {
        const rad = deg * Math.PI / 180;
        ECLIPTIC_POINTS.push([Math.cos(rad), Math.sin(rad) * COS_EPS, Math.sin(rad) * SIN_EPS]);
      }

      // Precompute 360 points along the Celestial Equator in JNOW frame
      const EQUATOR_POINTS = [];
      for (let deg = 0; deg < 360; deg += 1) {
        const rad = deg * Math.PI / 180;
        EQUATOR_POINTS.push([Math.cos(rad), Math.sin(rad), 0]);
      }

      // Precompute J2000 grid lines in ICRF frame
      const J2000_PARALLELS = [-80, -60, -40, -20, 0, 20, 40, 60, 80].map(decDeg => {
        const decRad = decDeg * Math.PI / 180;
        const cosDec = Math.cos(decRad);
        const sinDec = Math.sin(decRad);
        const pts = [];
        for (let raDeg = 0; raDeg < 360; raDeg += 2) {
          const raRad = raDeg * Math.PI / 180;
          pts.push([cosDec * Math.cos(raRad), cosDec * Math.sin(raRad), sinDec]);
        }
        return pts;
      });

      const J2000_MERIDIANS = Array.from({ length: 12 }, (_, i) => i * 30).map(raDeg => {
        const raRad = raDeg * Math.PI / 180;
        const cosRa = Math.cos(raRad);
        const sinRa = Math.sin(raRad);
        const pts = [];
        for (let decDeg = -80; decDeg <= 80; decDeg += 2) {
          const decRad = decDeg * Math.PI / 180;
          pts.push([Math.cos(decRad) * cosRa, Math.cos(decRad) * sinRa, Math.sin(decRad)]);
        }
        return pts;
      });

      function projectToOverlay(vView, width, height, fovRad) {
        if (!vView || vView[2] >= 0.99) return null;
        const denom = 0.5 * (1.0 - vView[2]);
        const px = vView[0] / denom;
        const py = vView[1] / denom;
        const scale = (height / 2) / (2 * Math.tan(fovRad / 4));
        return {
          x: width / 2 + px * scale,
          y: height / 2 - py * scale,
        };
      }

      function drawCustomLine(points3d, frameName, style, isClosed = true) {
        if (!stel || !overlayCtx || !points3d.length) return;
        const obs = stel.core.observer;
        const fovRad = stel.core.fov;
        const dpr = window.devicePixelRatio || 1;
        const width = overlayCanvas.width;
        const height = overlayCanvas.height;

        overlayCtx.save();
        overlayCtx.strokeStyle = style.color || '#E5B832';
        overlayCtx.lineWidth = (style.width || 2.0) * dpr;
        if (style.dash) overlayCtx.setLineDash(style.dash.map(d => d * dpr));

        let inPath = false;
        let lastX = 0;
        let lastY = 0;
        overlayCtx.beginPath();
        const count = isClosed ? points3d.length + 1 : points3d.length;

        for (let i = 0; i < count; i++) {
          const pt = points3d[i % points3d.length];
          const vView = stel.convertFrame(obs, frameName, 'VIEW', [pt[0], pt[1], pt[2], 0]);
          const screenPt = projectToOverlay(vView, width, height, fovRad);

          if (screenPt) {
            const distSq = (screenPt.x - lastX) ** 2 + (screenPt.y - lastY) ** 2;
            if (!inPath || distSq > (width * 1.2) ** 2) {
              overlayCtx.moveTo(screenPt.x, screenPt.y);
              inPath = true;
            } else {
              overlayCtx.lineTo(screenPt.x, screenPt.y);
            }
            lastX = screenPt.x;
            lastY = screenPt.y;
          } else {
            inPath = false;
          }
        }
        overlayCtx.stroke();
        overlayCtx.restore();
      }

      function renderCustomOverlay() {
        requestAnimationFrame(renderCustomOverlay);
        if (!stel || !overlayCanvas || !overlayCtx) return;

        const skyCanvas = document.getElementById('sky');
        const dpr = window.devicePixelRatio || 1;
        const rect = skyCanvas.getBoundingClientRect();
        const displayW = Math.round(rect.width * dpr);
        const displayH = Math.round(rect.height * dpr);

        if (overlayCanvas.width !== displayW || overlayCanvas.height !== displayH) {
          overlayCanvas.width = displayW;
          overlayCanvas.height = displayH;
        }

        overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

        const hasCustom = customGridLines.ecliptic || customGridLines.equator || customGridLines.equatorial_j2000;
        if (!hasCustom) return;

        if (customGridLines.equator) {
          drawCustomLine(EQUATOR_POINTS, 'JNOW', { color: 'rgba(51, 161, 253, 0.95)', width: 2.0 }, true);

        if (customGridLines.ecliptic) {
          drawCustomLine(ECLIPTIC_POINTS, 'ICRF', { color: 'rgba(255, 204, 0, 0.95)', width: 2.0 }, true);
        }
        if (customGridLines.equatorial_j2000) {
          for (const parallel of J2000_PARALLELS) {
            drawCustomLine(parallel, 'ICRF', { color: 'rgba(120, 175, 245, 0.45)', width: 1.2, dash: [6, 6] }, true);

          for (const meridian of J2000_MERIDIANS) {
            drawCustomLine(meridian, 'ICRF', { color: 'rgba(120, 175, 245, 0.45)', width: 1.2, dash: [6, 6] }, false);
          }
        }

      // Constellation labels are drawn from the sky-culture JSON, never through translateFn,
      // so Chinese names have to be swapped into the payload before the engine parses it.
      (() => {
        const proto = XMLHttpRequest.prototype;
        const responseDescriptor = Object.getOwnPropertyDescriptor(proto, 'response');
        const open = proto.open;
        proto.open = function (method, url) {
          this.__isSkyCultureIndex = /skycultures\/[^/]+\/index\.json/.test(String(url));
          return open.apply(this, arguments);
        };
        Object.defineProperty(proto, 'response', {
          configurable: true,
          get() {
            const raw = responseDescriptor.get.call(this);
            if (!this.__isSkyCultureIndex || window.__STEL_LANG !== 'zh' || !(raw instanceof ArrayBuffer)) return raw;
            try {
              const culture = JSON.parse(new TextDecoder().decode(new Uint8Array(raw)));
              for (const constellation of culture.constellations ?? []) {
                const name = constellation.common_name;
                if (!name) continue;
                const chinese = NAMES_ZH[name.native] ?? NAMES_ZH[name.english];
                if (!chinese) continue;
                name.native = chinese;
                name.english = chinese;
              }
              return new TextEncoder().encode(JSON.stringify(culture)).buffer;
            } catch { return raw; }
          },
        });
      })();
      // --- Calendar astronomy -------------------------------------------------
      // The bundled wasm strips the calendar_* symbols, so stel.calendar() is dead code.
      // Everything below is derived by sampling object altitude across observer.tt instead.
      const PLANETS = [
        { id: 'NAME Mercury', key: 'mercury' },
        { id: 'NAME Venus', key: 'venus' },
        { id: 'NAME Mars', key: 'mars' },
        { id: 'NAME Jupiter', key: 'jupiter' },
        { id: 'NAME Saturn', key: 'saturn' },
        { id: 'NAME Uranus', key: 'uranus' },
        { id: 'NAME Neptune', key: 'neptune' },
      ];
      const DAY_MS = 86400000;
      const SUNSET_ALT = -0.833;
      const NIGHT_ALT = -18;
      let METEOR_SHOWERS = [];

      const toMJD = date => stel.date2MJD(date);
      const fromMJD = mjd => stel.MJD2date(mjd);

      /** Runs `body` with the observer moved to `location`, always restoring the live state. */
      function withObserver(latitudeDeg, longitudeDeg, body) {
        const observer = stel.core.observer;
        const tt = observer.tt;
        const latitude = observer.latitude;
        const longitude = observer.longitude;
        try {
          if (isFiniteNumber(latitudeDeg)) observer.latitude = latitudeDeg * stel.D2R;
          if (isFiniteNumber(longitudeDeg)) observer.longitude = longitudeDeg * stel.D2R;
          return body();
        } finally {
          observer.tt = tt;
          observer.latitude = latitude;
          observer.longitude = longitude;
        }
      }

      function altitudeAt(object, mjd) {
        const observer = stel.core.observer;
        observer.utc = mjd;
        const equatorial = object.getInfo('radec');
        const horizontal = stel.convertFrame(observer, 'ICRF', 'OBSERVED', equatorial);

      /** Bisects a bracketed altitude crossing down to ~1 second. */
      function refineCrossing(object, threshold, lowMjd, highMjd) {
        let low = lowMjd;
        let high = highMjd;
        const lowAbove = altitudeAt(object, low) > threshold;
        for (let step = 0; step < 20; step += 1) {
          const middle = (low + high) / 2;
          if ((altitudeAt(object, middle) > threshold) === lowAbove) low = middle;
          else high = middle;
        }
        return (low + high) / 2;
      }

      /** Scans [startMjd, endMjd] and returns every threshold crossing in order. */
      function findCrossings(object, threshold, startMjd, endMjd, stepMinutes) {
        const step = stepMinutes / 1440;
        const crossings = [];
        let previousMjd = startMjd;
        let previousAbove = altitudeAt(object, startMjd) > threshold;
        for (let mjd = startMjd + step; mjd <= endMjd; mjd += step) {
          const above = altitudeAt(object, mjd) > threshold;
          if (above !== previousAbove) {
            crossings.push({ mjd: refineCrossing(object, threshold, previousMjd, mjd), rising: above });
          }
          previousMjd = mjd;
          previousAbove = above;
        }
        return crossings;
      }

      function phaseName(illumination, waxing) {
        if (illumination < 0.02) return 'new_moon';
        if (illumination > 0.98) return 'full_moon';
        if (Math.abs(illumination - 0.5) < 0.03) return waxing ? 'first_quarter' : 'last_quarter';
        if (illumination < 0.5) return waxing ? 'waxing_crescent' : 'waning_crescent';
        return waxing ? 'waxing_gibbous' : 'waning_gibbous';

      function moonIllumination(mjd) {
        const observer = stel.core.observer;

      function computeTonight(message) {
        const base = new Date(message.isoDate);
        if (Number.isNaN(base.getTime())) return reportError('Invalid calendar date.');
        return withObserver(message.latitudeDeg, message.longitudeDeg, () => {
          // Anchor on local noon so the window always spans the coming night.
          const noon = new Date(base);
          noon.setHours(12, 0, 0, 0);
          const startMjd = toMJD(noon);
          const endMjd = startMjd + 1;
          const sun = stel.getObj('NAME Sun');
          const moon = stel.getObj('NAME Moon');

          const sunCrossings = findCrossings(sun, SUNSET_ALT, startMjd, endMjd, 6);
          const sunset = sunCrossings.find(crossing => !crossing.rising);
          const sunrise = sunCrossings.find(crossing => crossing.rising);
          const nightCrossings = findCrossings(sun, NIGHT_ALT, startMjd, endMjd, 6);
          const duskEnd = nightCrossings.find(crossing => !crossing.rising);
          const dawnStart = nightCrossings.find(crossing => crossing.rising);

          const nightStart = sunset ? sunset.mjd : startMjd + 0.25;
          const nightEnd = sunrise ? sunrise.mjd : endMjd;

          const moonCrossings = findCrossings(moon, 0, startMjd, endMjd, 6);
          const moonRise = moonCrossings.find(crossing => crossing.rising);
          const moonSet = moonCrossings.find(crossing => !crossing.rising);
          const illumination = moonIllumination(nightStart);
          const waxing = moonIllumination(nightStart + 0.02) > illumination;

          const planets = [];
          for (const planet of PLANETS) {
            const object = stel.getObj(planet.id);
            if (!object) continue;
            // Sample the night in 10 minute slices and keep the longest above-horizon run.
            const step = 10 / 1440;
            let bestStart = null;
            let bestEnd = null;
            let bestAltitude = -90;
            let runStart = null;
            let runPeak = -90;
            for (let mjd = nightStart; mjd <= nightEnd; mjd += step) {
              const altitude = altitudeAt(object, mjd);
              if (altitude > 0) {
                if (runStart === null) runStart = mjd;
                runPeak = Math.max(runPeak, altitude);
              } else if (runStart !== null) {
                if (bestStart === null || mjd - runStart > bestEnd - bestStart) {
                  bestStart = runStart;
                  bestEnd = mjd;
                  bestAltitude = runPeak;
                }
                runStart = null;
                runPeak = -90;
              }
            }
            if (runStart !== null && (bestStart === null || nightEnd - runStart > bestEnd - bestStart)) {
              bestStart = runStart;
              bestEnd = nightEnd;
              bestAltitude = runPeak;
            }
            if (bestStart === null) continue;
            planets.push({
              key: planet.key,
              from: fromMJD(bestStart).toISOString(),
              to: fromMJD(bestEnd).toISOString(),
              peakAltitudeDeg: Math.round(bestAltitude),
              magnitude: object.getInfo('vmag'),
            });
          }

          return {
            sunset: sunset ? fromMJD(sunset.mjd).toISOString() : null,
            sunrise: sunrise ? fromMJD(sunrise.mjd).toISOString() : null,
            duskEnd: duskEnd ? fromMJD(duskEnd.mjd).toISOString() : null,
            dawnStart: dawnStart ? fromMJD(dawnStart.mjd).toISOString() : null,
            moon: {
              illumination,
              phase: phaseName(illumination, waxing),
              rise: moonRise ? fromMJD(moonRise.mjd).toISOString() : null,
              set: moonSet ? fromMJD(moonSet.mjd).toISOString() : null,
            },
            planets,
          };
        });
      }

      /**
       * Geocentric right-ascension separation in [-180, 180).  The compact wasm build
       * aborts when converting ICRF -> ECLIPTIC, so this intentionally uses radec.
       * It is sufficient for an almanac-level conjunction/opposition notice.
       */
      function elongationAt(object, sun, mjd) {
        const observer = stel.core.observer;
        observer.utc = mjd;
        const planetRa = stel.c2s(object.getInfo('radec'))[0];
        const sunRa = stel.c2s(sun.getInfo('radec'))[0];
        return stel.anpm(planetRa - sunRa) * stel.R2D;
      }

      function computeEvents(message) {
        const start = new Date(message.isoStart);
        if (Number.isNaN(start.getTime())) return reportError('Invalid calendar range.');
        const days = isFiniteNumber(message.days) ? Math.min(Math.max(message.days, 1), 400) : 60;
        return withObserver(message.latitudeDeg, message.longitudeDeg, () => {
          const startMjd = toMJD(start);
          const endMjd = startMjd + days;
          const events = [];
          const sun = stel.getObj('NAME Sun');
          const moon = stel.getObj('NAME Moon');

          // Lunar quarters: the illuminated fraction hits 0, 0.5 and 1 four times a month.
          const quarterStep = 0.25;
          let previousMjd = startMjd;
          let previousIllumination = moonIllumination(startMjd);
          let previousWaxing = moonIllumination(startMjd + 0.02) > previousIllumination;
          for (let mjd = startMjd + quarterStep; mjd <= endMjd; mjd += quarterStep) {
            const illumination = moonIllumination(mjd);
            const waxing = illumination > previousIllumination;
            for (const target of [0.5]) {
              if ((previousIllumination - target) * (illumination - target) < 0) {
                events.push({
                  type: waxing ? 'first_quarter' : 'last_quarter',
                  time: fromMJD((previousMjd + mjd) / 2).toISOString(),
                });
              }
            }
            if (previousWaxing && !waxing) events.push({ type: 'full_moon', time: fromMJD(previousMjd).toISOString() });
            if (!previousWaxing && waxing) events.push({ type: 'new_moon', time: fromMJD(previousMjd).toISOString() });
            previousMjd = mjd;
            previousIllumination = illumination;
            previousWaxing = waxing;
          }

          // Oppositions (elongation crosses 180) and conjunctions (crosses 0).
          for (const planet of PLANETS) {
            const object = stel.getObj(planet.id);
            if (!object) continue;
            let previousElongation = elongationAt(object, sun, startMjd);
            let previousSampleMjd = startMjd;
            for (let mjd = startMjd + 1; mjd <= endMjd; mjd += 1) {
              const elongation = elongationAt(object, sun, mjd);
              // anpm wraps at ±180, so an opposition shows up as a sign flip with a large gap.
              const wrapped = Math.abs(elongation - previousElongation) > 180;
              if (wrapped) {
                events.push({ type: 'opposition', target: planet.key, time: fromMJD((previousSampleMjd + mjd) / 2).toISOString() });
              } else if (previousElongation * elongation < 0) {
                events.push({ type: 'conjunction', target: planet.key, time: fromMJD((previousSampleMjd + mjd) / 2).toISOString() });
              }
              previousElongation = elongation;
              previousSampleMjd = mjd;
            }
          }

          // Meteor showers are a static almanac; just pick the peaks inside the window.
          const startDate = fromMJD(startMjd);
          const endDate = fromMJD(endMjd);
          for (const shower of METEOR_SHOWERS) {
            const [month, day] = String(shower.peak).split('-').map(Number);
            if (!month || !day) continue;
            for (let year = startDate.getFullYear(); year <= endDate.getFullYear(); year += 1) {
              const peak = new Date(year, month - 1, day, 22, 0, 0);
              if (peak >= startDate && peak <= endDate) {
                events.push({ type: 'meteor_shower', name: shower.designation, zhr: shower.zhr, time: peak.toISOString() });
              }
            }
          }

          events.sort((a, b) => Date.parse(a.time) - Date.parse(b.time));
          return { events };
        });
      }

      /**
       * A refresh must never touch the camera target. The bundled core implements
       * core_lookat(pos, 0) by memset-ing core->target, which drops both the
       * in-flight pointAndLock animation and the lock that keeps following the
       * centered object. The periodic set_time tick and layer toggles used to run
       * exactly that refresh, so they cancelled a center the user was watching.
       * Every programmatic center goes through this scene, so one flag keeps the
       * refreshes away from the camera.
       */
      const cameraState = { lockedToTarget: false };
      /**
       * view_state stays gated until the app delivers its restore decision:
       * publishing the default horizon view before restore_view would overwrite
       * the view the app archived. restore_view with a null state means "nothing
       * archived" and only opens the channel. Azimuth/altitude are read from the
       * same real VIEW->OBSERVED direction the compass uses and fov from core.fov,
       * so the app never persists a guessed camera pose.

      function openViewStateChannel() { viewState.gateOpen = true; }
      function publishViewState(azimuthDeg, altitudeDeg) {

        // Only meaningful movement is reported: this runs every 250 ms and every
        // report is persisted by the app.
        if (viewState.lastAzimuthDeg !== null
            && Math.abs(azimuthDeg - viewState.lastAzimuthDeg) < 0.05
            && Math.abs(altitudeDeg - viewState.lastAltitudeDeg) < 0.05
            && Math.abs(fovDeg - viewState.lastFovDeg) < 0.01) return;

      /** Single place that starts a camera center, so refreshes know a lock is live. */

      function publishBearing() {

        const spherical = stel.c2s(forward);
        const azimuthDeg = (spherical[0] * stel.R2D % 360 + 360) % 360;
        // Publish the persisted view before the bearing's own early return;
        // otherwise a stationary view would never report altitude or fov.

      }

      function reportError(message) { send({ type: 'error', message: String(message) }); }
      function gotoRaDec(message) {
        const raDeg = message.raDeg ?? message.ra;
        const decDeg = message.decDeg ?? message.dec;
        if (!isFiniteNumber(raDeg) || raDeg < 0 || raDeg > 360 || !isFiniteNumber(decDeg) || decDeg < -90 || decDeg > 90) return reportError('Invalid RA/Dec command.');
        openViewStateChannel();
        const icrf = stel.s2c(raDeg * Math.PI / 180, decDeg * Math.PI / 180);
        stel.lookAt(stel.convertFrame(stel.core.observer, 'ICRF', 'OBSERVED', icrf), message.duration ?? 0.5);
      }
      function zoomTo(message) {
        const fovDeg = message.fovDeg ?? message.fov;
        if (!isFiniteNumber(fovDeg) || fovDeg <= 0 || fovDeg > 360) return reportError('Invalid FOV command.');
        openViewStateChannel();
        stel.zoomTo(fovDeg * Math.PI / 180, message.duration ?? 0.3);
      }
      function setViewBearing(message) {
        const azimuthDeg = message.azimuthDeg;
        if (!isFiniteNumber(azimuthDeg) || azimuthDeg < 0 || azimuthDeg > 360) return reportError('Invalid view bearing command.');
        openViewStateChannel();
        const forward = stel.convertFrame(stel.core.observer, 'VIEW', 'OBSERVED', [0, 0, -1, 0]);
        const altitudeRad = stel.c2s(forward)[1];
        stel.lookAt(stel.s2c(azimuthDeg * stel.D2R, altitudeRad), 0.1);
      }
      function determineObjectType(cleanName, id, obj) {
        const data = obj?.jsonData;
        if (data?.model === 'dso') return { type: 'dso', typeZh: '深空天体' };
        if (data?.model === 'tle_satellite') return { type: 'satellite', typeZh: '人造卫星' };
        if (data?.model === 'mpc_comet') return { type: 'comet', typeZh: '彗星' };
        if (data?.types?.includes('Moo')) return { type: 'moon', typeZh: '卫星' };
        if (/^CON\s+/i.test(id) || (obj && obj.type === 'constellation') || cleanName.endsWith('座')) {
          return { type: 'constellation', typeZh: '星座' };
        }
        const planets = ['Mercury', 'Venus', 'Mars', 'Jupiter', 'Saturn', 'Uranus', 'Neptune', 'Pluto'];
        if (cleanName === 'Sun') return { type: 'star', typeZh: '恒星' };
        if (cleanName === 'Moon') return { type: 'moon', typeZh: '卫星' };
        if (planets.includes(cleanName)) return { type: 'planet', typeZh: '行星' };
        if (/^(ISS|CSS|Satellite|TIANGONG|NOAA|STARLINK)/i.test(id) || (obj && obj.type === 'satellite')) return { type: 'satellite', typeZh: '人造卫星' };
        if (/^(M |NGC |IC |C |Ced |Sh2 |vdB |LDN |LBN )/i.test(cleanName) || (obj && /^(dso|galaxy|nebula|cluster)/i.test(obj.type || ''))) return { type: 'dso', typeZh: '深空天体' };
        if (/^COMET\s+/i.test(id) || (obj && obj.type === 'comet')) return { type: 'comet', typeZh: '彗星' };
        return { type: 'star', typeZh: '恒星' };
      }

      function computeHourAngle(raHours) {
        if (!isFiniteNumber(raHours)) return null;
        try {
          // The zenith is on the local meridian. Use the engine's CIRS frame
          // rather than subtracting J2000 RA from a sidereal-time approximation.
          const obs = stel.core.observer;
          if (Math.abs(obs.latitude) >= Math.PI / 2 - 1e-8) return null;
          const meridian = stel.c2s(stel.convertFrame(obs, 'OBSERVED', 'CIRS', [0, 0, 1, 0]));
          const meridianHours = meridian[0] * stel.R2D / 15;
          return isFiniteNumber(meridianHours) ? ((meridianHours - raHours) % 24 + 24) % 24 : null;
        } catch {
          return null;
        }
      }

      function nativeAngularSize(obj, cleanName, distanceAu) {
        const dimx = obj.jsonData?.model_data?.dimx;
        if (isFiniteNumber(dimx) && dimx > 0) return dimx * 60; // DSO major axis: arcminutes.
        const radius = obj.getInfo?.('radius'); // Apparent angular radius: radians.
        if (isFiniteNumber(radius) && radius > 0) return 2 * radius * stel.R2D * 3600;
        return computePlanetSize(cleanName, distanceAu);
      }

      function computePlanetSize(cleanName, distanceAu) {
        const radii = {
          Sun: 696340,
          Moon: 1737.4,
          Mercury: 2439.7,
          Venus: 6051.8,
          Mars: 3389.5,
          Jupiter: 69911,
          Saturn: 58232,
          Uranus: 25362,
          Neptune: 24622,
          Pluto: 1188.3,

        const r = radii[cleanName];
        if (r && distanceAu && distanceAu > 0) {
          const distanceKm = distanceAu * 149597870.7;

        return null;
      }

      function isOrbitDataUsable(obj) {
        const data = obj?.jsonData;
        if (data?.model !== 'tle_satellite') return true;
        const epoch = data.model_data?.tle?.[0]?.slice(18, 32);
        if (typeof epoch !== 'string' || !/^\d{5}\.\d{8}$/.test(epoch)) return false;
        const yy = Number(epoch.slice(0, 2));
        const day = Number(epoch.slice(2));
        const year = yy < 57 ? 2000 + yy : 1900 + yy;
        if (day < 1 || day >= 367) return false;
        const epochMjd = Date.UTC(year, 0, 1) / 86400000 + 40587 + day - 1;
        // Conservative application policy: do not advertise stale TLE predictions
        // as current observations. A newer orbital data package is then required.
        return Math.abs(stel.core.observer.utc - epochMjd) <= 2;
      }

      let satelliteEpochReference = null;
      function updateSatelliteVisibility() {

      }

      function findCelestialObject(target, skipCatalog = false) {
        if (!target || typeof target !== 'string') return null;
        const trimmed = target.trim();
        if (!trimmed) return null;

        const entry = !skipCatalog && searchCatalogByAlias.get(catalogKey(trimmed));
        if (entry) {
          if (entry.category === 'constellation' && stel.core.skycultures.current_id !== 'western') return null;
          for (const candidate of [...entry.engineIds, entry.id, entry.nameEn, ...entry.aliases]) {
            const object = findCelestialObject(candidate, true);
            if (object) {
              if (object.id) searchCatalogByAlias.set(catalogKey(object.id), entry);
              catalogLookupStarted.delete(entry.id);
              return object;
            }
          }
          return null;
        }

        const currentCulture = (stel && stel.core && stel.core.skycultures && stel.core.skycultures.current_id) || 'western';

        // Check if target refers to a western constellation
        const lower = trimmed.toLowerCase();
        const westernCode = WESTERN_LOOKUP[lower];
        if (westernCode || lower.startsWith('con western ')) {
          // Rule: Non-western sky culture must not switch automatically; return null
          if (currentCulture !== 'western') {

          const iauCode = westernCode || trimmed.slice(12).trim();
          const conObj = stel.getObj('CON western ' + iauCode) || stel.getObj(trimmed);

        // 1. Direct match with stel.getObj

        // 2. Common synonyms (e.g. 织女星 -> Vega, 太阳 -> NAME Sun, Andromeda Galaxy -> M 31)
        if (COMMON_SYNONYMS[trimmed]) {

        if (REVERSE_NAMES_ZH[trimmed]) {

        const ngcMatch = trimmed.match(/^ngc\s*(\d+)$/i);

        const icMatch = trimmed.match(/^ic\s*(\d+)$/i);
        if (icMatch) {

        const cMatch = trimmed.match(/^c\s*(\d+)$/i);
        if (cMatch) {
          obj = stel.getObj('C ' + cMatch[1]);
          if (obj) return obj;
        }

        if (hipMatch) {
          obj = stel.getObj('HP ' + hipMatch[1]);

        if (/galaxy$/i.test(trimmed)) {

      function getTargetUnavailableReason(target) {

        if (!entry) return 'not_found';

          designations,
          type,
          typeZh,
          vmag: finite(obj.getInfo('vmag')),
          distanceAu,
          phase: finite(obj.getInfo('phase')),
          sizeArcsec: nativeAngularSize(obj, cleanName, distanceAu),
          coordinateFrame: 'CIRS',
          raHours,
          decDeg: degrees(cirs?.[1]),
          raJ2000Hours: hours(j2000?.[0]),
          decJ2000Deg: degrees(j2000?.[1]),
          hourAngleHours: computeHourAngle(raHours),
          azDeg: isFiniteNumber(azalt?.[0]) ? ((azalt[0] * stel.R2D % 360 + 360) % 360) : null,
          altDeg: degrees(azalt?.[1]),
        };
      }

      function handleSkyClick() {
        setTimeout(() => {
          const sel = stel.core.selection;
          if (sel) {
            const payload = formatSelectedObject(sel);
            if (payload) {
              send({ type: 'object_selected', object: payload });
              return;
            }
          }
          send({ type: 'selection_cleared' });
        }, 50);
      }

      function focusSkyCultureTarget(target, retries = 80) {
        const object = stel.getObj(target);
        if (object) {
          centerOnObject(object, 0.5);
          return send({ type: 'target_found' });
        }
        if (retries <= 0) return send({ type: 'target_not_found' });
        return setTimeout(() => focusSkyCultureTarget(target, retries - 1), 50);
      }
      function forceRender() {
        // core_lookat(pos, 0) memsets core->target, so a refresh would drop an
        // in-flight center animation and its lock. The engine already renders
        // continuously (requestAnimationFrame -> core_update + core_render), so
        // property changes land on the next frame without touching the camera.
        if (!stel || cameraState.lockedToTarget) return;
        try {
          const forward = stel.convertFrame(stel.core.observer, 'VIEW', 'OBSERVED', [0, 0, -1, 0]);
          stel.lookAt(forward, 0);
        } catch {}
      }
      /**
       * Some builds omit optional module flags; a throw here must not skip the
       * rest of a layer batch. The failure is reported rather than swallowed:
       * a silently dropped assignment is indistinguishable from a working one,
       * which is exactly how the magnitude-limit bug stayed hidden.
       */
      function setModuleFlag(module, key, value) {
        if (!module) return;
        try { module[key] = value; } catch (e) { reportError('Failed to set ' + key + ': ' + e); }
      }

      /**
       * `display_limit_mag` has two writers: the user's explicit limit from the
       * advanced panel, and the value derived from the Bortle light-pollution
       * level. They used to write the property directly, so whichever ran last
       * won and any environment change silently wiped the user's setting.
       * Both now record their own slot and defer to this single decision point.
       */
      const magnitudeState = { userLimit: null, bortleLimit: 99 };

      /** User intent wins; fall back to the light-pollution estimate. */
      function applyMagnitudeLimit() {
        const value = magnitudeState.userLimit ?? magnitudeState.bortleLimit;
        setModuleFlag(stel.core, 'display_limit_mag', value);
      }

      function execute(message) {
        switch (message.type) {
          case 'goto_radec': return gotoRaDec(message);
          case 'zoom_to': return zoomTo(message);
          case 'clear_selection': {
            stel.core.selection = null;
            cameraState.lockedToTarget = false;
            send({ type: 'selection_cleared' });
            forceRender();
            return;
          }
          case 'restore_view': {
            const state = message.state;
            if (state === null || state === undefined) {
              // The app has nothing archived: open the report channel without
              // moving the camera.
              openViewStateChannel();
              return;
            }
            const azimuthDeg = state.azimuthDeg;
            const altitudeDeg = state.altitudeDeg;
            const fovDeg = state.fovDeg;
            if (!isFiniteNumber(azimuthDeg) || !isFiniteNumber(altitudeDeg) || !isFiniteNumber(fovDeg)
                || azimuthDeg < 0 || azimuthDeg >= 360 || altitudeDeg < -90 || altitudeDeg > 90
                || fovDeg <= 0 || fovDeg > 360) {
              // Strict contract: a rejected state is reported, never applied and
              // never silently mistaken for a restored view. The fov ceiling is the
              // same 360 degree limit zoom_to accepts; the live core reports wide
              // values like 182.28 and they must round-trip unchanged.
              return reportError('Invalid view state.');
            }
            try {
              // lookAt with duration 0 also memsets core->target, which is what
              // drops a stale lock so the restored view cannot snap back to the
              // object centered earlier.
              cameraState.lockedToTarget = false;
              stel.lookAt(stel.s2c(azimuthDeg * stel.D2R, altitudeDeg * stel.D2R), 0);
              stel.zoomTo(fovDeg * stel.D2R, 0);
            } catch (e) {
              return reportError('Failed to restore view: ' + e);
            }
            openViewStateChannel();
            return;
          }
          case 'point_and_lock': {
            try {
              // The app centers the object it just received from object_selected,
              // so the engine selection already is that target. Re-resolving the
              // designation would be slower and can resolve to a different object
              // (or fail) for aliases and catalog names.
              const requestedId = typeof message.name === 'string' ? message.name : null;
              const selected = stel.core.selection;
              const targetObj = requestedId && selected && selected.id === requestedId
                  ? selected
                : requestedId ? findCelestialObject(requestedId)
                : selected;
              if (!targetObj) return reportError('Target not found: ' + (requestedId || 'no selection'));
              if (!isOrbitDataUsable(targetObj)) return reportError('Target data unavailable: ' + (targetObj.id || requestedId));
              centerOnObject(targetObj, 0.5);
              const payload = formatSelectedObject(targetObj);
              if (payload) send({ type: 'object_selected', object: payload });
              return;
            } catch (e) {
              return reportError('Failed to center target: ' + e);
            }
          }
          case 'search_target': {
            try {
              const object = findCelestialObject(message.name);
              if (!object || !isOrbitDataUsable(object)) return send({ type: 'target_not_found' });
              centerOnObject(object, 0.5);
              const payload = formatSelectedObject(object);
              if (payload) send({ type: 'object_selected', object: payload });
              send({ type: 'target_found' });
              return;
            } catch {
              return send({ type: 'target_not_found' });
            }
          }
          case 'get_object_info': {
            const object = findCelestialObject(message.name);
            return send({ type: 'object_info_result', requestId: message.requestId, object: formatSelectedObject(object) });
          }
          case 'set_search_catalog': return registerSearchCatalog(message.items);
          case 'query_targets': {
            const names = Array.isArray(message.names) ? message.names : [];
            const targets = names.map(rawName => {
              const trimmed = typeof rawName === 'string' ? rawName.trim() : '';
              if (!trimmed) {
                return { id: rawName, available: false, reason: getTargetUnavailableReason(trimmed) };
              }
              const object = findCelestialObject(trimmed);
              if (!object) {
                return { id: rawName, available: false, reason: getTargetUnavailableReason(trimmed) };
              }
              if (!isOrbitDataUsable(object)) return { id: rawName, available: false, reason: 'missing_data' };
              let altDeg = null;
              let azDeg = null;
              if (object.getInfo) {
                try {
                  const radec = object.getInfo('radec');
                  if (radec) {
                    const azalt = stel.c2s(stel.convertFrame(stel.core.observer, 'ICRF', 'OBSERVED', radec));
                    if (azalt && isFiniteNumber(azalt[0]) && isFiniteNumber(azalt[1])) {
                      azDeg = ((azalt[0] * stel.R2D % 360 + 360) % 360);
                      altDeg = azalt[1] * stel.R2D;
                    }
                  }
                } catch {}
              }
              let vmag = object.getInfo ? object.getInfo('vmag') : null;
              return {
                id: rawName,
                available: true,
                canonicalId: object.id,
                reason: 'available',
                altDeg: isFiniteNumber(altDeg) ? altDeg : null,
                azDeg: isFiniteNumber(azDeg) ? azDeg : null,
                vmag: isFiniteNumber(vmag) ? vmag : null,
              };
            });
            return send({ type: 'query_targets_result', requestId: message.requestId, targets });
          }
          case 'focus_target': {
            const token = typeof message.token === 'number' ? message.token : activeFocusToken + 1;
            if (currentCancelToken >= token || activeFocusToken > token) {
              return send({ type: 'focus_target_result', requestId: message.requestId, object: null });
            }
            activeFocusToken = Math.max(activeFocusToken, token);
            const object = findCelestialObject(message.name);
            if (!object) {
              const reason = getTargetUnavailableReason(message.name);
              if (reason === 'loading') {
                // Preserve the original token; cancellation/newer selections are
                // rechecked before each retry. The lookup budget is eight seconds.
                return setTimeout(() => execute({ ...message, token }), 150);
              }
              return send({ type: 'focus_target_result', requestId: message.requestId, object: null, reason });
            }
            if (currentCancelToken >= token || activeFocusToken > token) {
              return send({ type: 'focus_target_result', requestId: message.requestId, object: null });
            }

            if (!isOrbitDataUsable(object)) {
              return send({ type: 'focus_target_result', requestId: message.requestId, object: null, reason: 'missing_data' });
            }
            centerOnObject(object, 0.6);

            const cleanName = (object.id || '').replace(/^NAME\s+/, '').replace(/^CON\s+[^\s]+\s+/, '');
            const { type } = determineObjectType(cleanName, object.id || '', object);
            let fovDeg = 10;
            if (isFiniteNumber(message.fovDeg) && message.fovDeg > 0 && message.fovDeg <= 360) {
              fovDeg = message.fovDeg;
            } else if (type === 'planet' || type === 'moon') {
              fovDeg = 2;
            } else if (type === 'constellation') {
              fovDeg = 40;
            } else if (type === 'dso') {
              const sizeArcsec = nativeAngularSize(object, cleanName, null);
              const computedFov = isFiniteNumber(sizeArcsec) && sizeArcsec > 0 ? (sizeArcsec / 3600) * 3 : 5;
              fovDeg = Math.min(90, Math.max(0.3, computedFov));
            } else {
              fovDeg = 10;
            }
            stel.zoomTo(fovDeg * Math.PI / 180, 0.6);

            const payload = formatSelectedObject(object);
            return send({ type: 'focus_target_result', requestId: message.requestId, object: payload });
          }
          case 'cancel_search': {
            // Token space is shared with focus_target (issued by the RN bridge as a
            // small incrementing counter). A wall-clock timestamp here would
            // permanently exceed every future focus token and break later searches,
            // so reuse the RN-issued token.
            const token = typeof message.token === 'number' ? message.token : activeFocusToken + 1;
            currentCancelToken = Math.max(currentCancelToken, token);
            activeFocusToken = Math.max(activeFocusToken, token);
            return;
          }
          case 'toggle_constellations':
            stel.core.constellations.lines_visible = Boolean(message.visible);
            forceRender();
            return;
          case 'set_sky_layers':
            if (typeof message.landscape === 'boolean')
              setModuleFlag(stel.core.landscapes, 'visible', message.landscape);
            if (typeof message.atmosphere === 'boolean')
              setModuleFlag(stel.core.atmosphere, 'visible', message.atmosphere);
            if (typeof message.constellationArt === 'boolean')
              setModuleFlag(stel.core.constellations, 'images_visible', message.constellationArt);
            if (typeof message.constellationBoundaries === 'boolean')
              setModuleFlag(stel.core.constellations, 'bounds_visible', message.constellationBoundaries);
            if (typeof message.constellationLabels === 'boolean')
              setModuleFlag(stel.core.constellations, 'labels_visible', message.constellationLabels);
            if (typeof message.constellationOnlyPointed === 'boolean')
              setModuleFlag(stel.core.constellations, 'show_only_pointed', message.constellationOnlyPointed);
            if (typeof message.constellationLines === 'boolean')
              setModuleFlag(stel.core.constellations, 'lines_visible', message.constellationLines);
            if (typeof message.planetLabels === 'boolean')
              setModuleFlag(stel.core.planets, 'hints_visible', message.planetLabels);
            if (typeof message.starLabels === 'boolean')
              setModuleFlag(stel.core.stars, 'hints_visible', message.starLabels);
            if (typeof message.dsoLabels === 'boolean') {
              setModuleFlag(stel.core.dsos, 'hints_visible', message.dsoLabels);
              setModuleFlag(stel.core.dsos, 'visible', message.dsoLabels);
            }
            if (typeof message.satelliteLabels === 'boolean')
              setModuleFlag(stel.core.satellites, 'hints_visible', message.satelliteLabels);
            if (typeof message.starHintsOffset === 'number') {
              setModuleFlag(stel.core.stars, 'hints_mag_offset', message.starHintsOffset);
              const limit = message.starHintsOffset <= 0
                ? 6.5 + message.starHintsOffset * 1.0
                : 6.5 + message.starHintsOffset * 13.0;
              magnitudeState.bortleLimit = Math.max(3.5, Math.min(99, limit));
              applyMagnitudeLimit();
            }
            if (typeof message.planetHintsOffset === 'number') {
              setModuleFlag(stel.core.planets, 'hints_mag_offset', message.planetHintsOffset);
              setModuleFlag(stel.core.minor_planets, 'hints_mag_offset', message.planetHintsOffset);
              setModuleFlag(stel.core.comets, 'hints_mag_offset', message.planetHintsOffset);
            }
            if (typeof message.dsoHintsOffset === 'number')
              setModuleFlag(stel.core.dsos, 'hints_mag_offset', message.dsoHintsOffset);
            if (typeof message.satelliteHintsOffset === 'number')
              setModuleFlag(stel.core.satellites, 'hints_mag_offset', message.satelliteHintsOffset);
            forceRender();
            return;
          case 'set_landscape': {
            if (typeof message.id !== 'string' || !/^[\w-]+$/.test(message.id)) return reportError('Invalid landscape.');
            if (message.id === 'none') {
              setModuleFlag(stel.core.landscapes, 'visible', false);
              forceRender();
              return;
            }
            if (!loadedLandscapes.has(message.id)) {
              stel.core.landscapes.addDataSource({ url: assetUrl(`data/landscapes/${message.id}`), key: message.id });
              loadedLandscapes.add(message.id);
            }
            stel.core.landscapes.current_id = message.id;
            setModuleFlag(stel.core.landscapes, 'visible', true);
            forceRender();
            return;
          }
          case 'set_environment':
            if (typeof message.bortleIndex === 'number') {
              const b = Math.max(1, Math.min(9, message.bortleIndex));
              setModuleFlag(stel.core, 'bortle_index', b);
              // Astronomical naked-eye limiting magnitude (NELM) mapping per Bortle class:
              // Bortle 1: pristine dark sky (mag 7.6+, 99 = full catalog), down to Bortle 9: city center (mag ~3.5)
              const nelmMappings = [99, 7.3, 6.8, 6.3, 5.8, 5.3, 4.8, 4.2, 3.4];
              magnitudeState.bortleLimit = nelmMappings[b - 1] ?? 99;
              applyMagnitudeLimit();
              // Milky Way visibility: brilliant in dark skies (Bortle 1-4), faint in suburbs (5-6), washed out in city (7-9)
              setModuleFlag(stel.core.milkyway, 'visible', b <= 6);
              // Scale aerosol turbidity with urban air quality / Bortle rating
              setModuleFlag(stel.core.atmosphere, 'turbidity', 0.96 + (b - 1) * 0.55);
            }
            if (typeof message.fog === 'boolean')
              setModuleFlag(stel.core.landscapes, 'fog_visible', message.fog);
            if (typeof message.cardinals === 'boolean')
              setModuleFlag(stel.core.cardinals, 'visible', message.cardinals);
            if (typeof message.turbidity === 'number')
              setModuleFlag(stel.core.atmosphere, 'turbidity', message.turbidity);
            if (Array.isArray(message.landscapeTint) && message.landscapeTint.length === 4) {
              try { stel.core.landscapes.current.color = message.landscapeTint; } catch {}
            }
            forceRender();
            return;
          case 'set_sky_culture': {
            if (typeof message.id !== 'string' || !/^[\w-]+$/.test(message.id)) return reportError('Invalid sky culture.');
            if (message.target !== undefined && (typeof message.target !== 'string' || !/^[\w .-]+$/.test(message.target))) return reportError('Invalid sky culture target.');
            if (!loadedSkyCultures.has(message.id)) {
              stel.core.skycultures.addDataSource({ url: assetUrl(`data/skycultures/${message.id}`), key: message.id });
              loadedSkyCultures.add(message.id);
            }
            stel.core.skycultures.current_id = message.id;
            stel.core.constellations.show_only_pointed = false;
            if (message.target) focusSkyCultureTarget(message.target);
            forceRender();
            return;
          }
          case 'set_time': {
            const date = new Date(message.isoTime);
            if (Number.isNaN(date.getTime())) return reportError('Invalid time command.');
            stel.core.observer.utc = stel.date2MJD(date);
            forceRender();
            return;
          }
          case 'set_magnitude_limit': {
            if (typeof message.magnitude !== 'number' || message.magnitude < 3.5 || message.magnitude > 99)
              return reportError('Invalid magnitude limit.');
            // 99 is the "no limit" sentinel: clearing the slot lets the
            // light-pollution estimate take over again.
            magnitudeState.userLimit = message.magnitude >= 99 ? null : message.magnitude;
            applyMagnitudeLimit();
            forceRender();
            return;
          }
          case 'set_brightness': {
            if (typeof message.brightness !== 'number' || message.brightness < 0.1 || message.brightness > 10)
              return reportError('Invalid brightness.');
            const b = message.brightness;
            // Native Stellarium Web exposure and star point-spread scale.
            // Factory defaults at brightness 1.0:
            // exposure_scale = 1.0, star_linear_scale = 0.4, star_relative_scale = 1.0
            setModuleFlag(stel.core, 'exposure_scale', b);
            setModuleFlag(stel.core, 'star_linear_scale', Math.max(0.05, Math.min(2.5, b * 0.4)));
            setModuleFlag(stel.core, 'star_relative_scale', Math.max(0.5, Math.min(2.0, Math.sqrt(b))));
            forceRender();
            return;
          }
          case 'set_grid_lines': {
            for (const line of ['azimuthal', 'meridian', 'equatorial_jnow']) {
              if (typeof message[line] !== 'boolean') continue;
              const module = stel.getModule(`core.lines.${line}`);
              if (module) module.visible = message[line];
            }
            if (typeof message.ecliptic === 'boolean') {
              customGridLines.ecliptic = message.ecliptic;
            }
            if (typeof message.equator === 'boolean') {
              customGridLines.equator = message.equator;
            }
            if (typeof message.equatorial_j2000 === 'boolean') {
              customGridLines.equatorial_j2000 = message.equatorial_j2000;
            }
            forceRender();
            return;
          }
          case 'set_location':
            if (!isFiniteNumber(message.latitudeDeg) || message.latitudeDeg < -90 || message.latitudeDeg > 90) return reportError('Invalid latitude.');
            if (!isFiniteNumber(message.longitudeDeg) || message.longitudeDeg < -180 || message.longitudeDeg > 180) return reportError('Invalid longitude.');
            stel.core.observer.latitude = message.latitudeDeg * stel.D2R;
            stel.core.observer.longitude = message.longitudeDeg * stel.D2R;
            forceRender();
            return;
          case 'compute_tonight': {
            const payload = computeTonight(message);
            if (payload) send({ type: 'tonight', requestId: message.requestId, payload });
            return;
          }
          case 'compute_events': {
            const payload = computeEvents(message);
            if (payload) send({ type: 'events', requestId: message.requestId, payload });
            return;
          }
          case 'set_view_bearing': return setViewBearing(message);
          case 'set_fov_frame':
            // The engine has no overlay-frame API; preserve the old command by setting its FOV.
            return zoomTo({ fovDeg: message.fovDeg ?? message.fov });
          default: return;
        }
      }
      const STELLARIUM_COMMANDS = new Set([
        'goto_radec', 'zoom_to', 'clear_selection', 'restore_view', 'point_and_lock', 'search_target',
        'toggle_constellations', 'set_sky_layers', 'set_landscape', 'set_environment',
        'set_sky_culture', 'set_time', 'set_magnitude_limit', 'set_brightness', 'set_grid_lines',
        'set_location', 'compute_tonight', 'compute_events', 'set_view_bearing', 'set_fov_frame',
        'get_object_info', 'set_search_catalog', 'query_targets', 'focus_target', 'cancel_search',
      ]);
      function receive(event) {
        try {
          if (!event.data) return;
          const message = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
          if (!message || typeof message.type !== 'string' || !STELLARIUM_COMMANDS.has(message.type)) return;
          if (!stel) pendingCommands.push(message); else execute(message);
        } catch { /* ignore non-Stellarium or third-party extension messages */ }
      }
      document.addEventListener('message', receive);
      window.addEventListener('message', receive);
      document.getElementById('sky').addEventListener('webglcontextlost', event => { event.preventDefault(); send({ type: 'context_lost' }); });
      document.getElementById('sky').addEventListener('webglcontextrestored', () => send({ type: 'context_restored' }));

      if (typeof StelWebEngine !== 'function') return reportError('Stellarium engine was not found.');
      // The app injects __STEL_LANG before this document loads; it restarts on language change.
      window.__STEL_LANG = window.__STEL_LANG || (new URLSearchParams(window.location.search).get('lang')) || 'en';
      // Names must resolve before the engine boots, because translateFn runs during init.
      Promise.all([
        fetch(assetUrl('names-zh.json')).then(response => response.json()).catch(() => ({})),
        fetch(assetUrl('data/meteor-showers.json')).then(response => response.json()).catch(() => ({ showers: [] })),
      ]).then(([names, meteors]) => {
        NAMES_ZH = names || {};
        REVERSE_NAMES_ZH = {};
        for (const [k, v] of Object.entries(NAMES_ZH)) {
          if (typeof v === 'string') REVERSE_NAMES_ZH[v] = k;
        }
        METEOR_SHOWERS = meteors.showers ?? [];
      }).then(startEngine);

      function startEngine() {
      StelWebEngine({
        wasmFile: assetUrl('stellarium-web-engine.wasm'),
        canvas: document.getElementById('sky'),
        translateFn: (domain, str) => (window.__STEL_LANG === 'zh' ? NAMES_ZH[str] ?? str : str),
        onReady(engine) {
          stel = engine;
          window.stel = engine;
          const core = stel.core;
          // The SDK queues its first render before onReady, but core_add_font
          // needs the native renderer created by that frame. Fast local fetches
          // otherwise register fonts too early and trap inside WASM.
          const fontsReady = new Promise(resolve => requestAnimationFrame(resolve)).then(() => {
            const uiFont = window.__STEL_LANG === 'zh' ? 'fonts/NotoSansSC-Subset.ttf' : 'fonts/Roboto-Regular.ttf';
            const uiFontBold = window.__STEL_LANG === 'zh' ? 'fonts/NotoSansSC-Subset.ttf' : 'fonts/Roboto-Bold.ttf';
            return Promise.all([
              stel.setFont('regular', assetUrl(uiFont)),
              stel.setFont('bold', assetUrl(uiFontBold)),
            ]);
          });
          core.stars.addDataSource({ url: assetUrl('data/stars') });
          core.dsos.addDataSource({ url: assetUrl('data/dso') });
          core.skycultures.addDataSource({ url: assetUrl('data/skycultures/western'), key: 'western' });
          core.milkyway.addDataSource({ url: assetUrl('data/surveys/milkyway') });
          core.landscapes.addDataSource({ url: assetUrl('data/landscapes/guereins'), key: 'guereins' });
          try {
            if (core.satellites && typeof core.satellites.addDataSource === 'function') {
              core.satellites.addDataSource({ url: assetUrl('data/tle_satellite.jsonl.gz'), key: 'jsonl/sat' });
            }
          } catch (e) {
            console.warn('Failed to add satellites data source:', e);
          }
          try {
            if (core.comets && typeof core.comets.addDataSource === 'function') {
              core.comets.addDataSource({ url: assetUrl('data/CometEls.txt'), key: 'mpc_comets' });
            }
          } catch (e) {
            console.warn('Failed to add comets data source:', e);
          }
          core.atmosphere.visible = true;
          core.landscapes.visible = true;
          core.constellations.images_visible = true;
          core.constellations.lines_visible = true;
          core.constellations.bounds_visible = false;
          core.dsos.visible = true;
          core.dsos.hints_visible = true;
          // Desktop Stellarium labels every constellation, not just the selected one.
          core.constellations.show_only_pointed = false;
          core.constellations.labels_visible = true;
          // Start looking just above the horizon so the landscape stays in frame.
          const horizonDirection = stel.s2c(0, 20 * stel.D2R);
          stel.lookAt(horizonDirection, 0);
          stel.on('click', handleSkyClick);
          void fontsReady.then(() => {
            send({ type: 'ready' });
            publishBearing();
            setInterval(publishBearing, 250);
            while (pendingCommands.length) execute(pendingCommands.shift());
          }).catch(reportError);
        },
        onError: reportError,
      }).catch?.(reportError);
      }
    })();
  </script>
</body>
